<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <!-- 强制手机端自适应屏幕宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>资质证书查询</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.4;
            background-color: #FFFFFF;
        }
        .cert-table {
            width: 100%; /* 表格占满手机屏幕宽度 */
            border-collapse: collapse;
        }
        .cert-table td {
            /* 40%透明度的灰色边框 */
            border: 1px solid rgba(0, 0, 0, 0.4);
            padding: 4px 6px; /* 缩小内边距，避免手机端溢出 */
            vertical-align: top;
            word-wrap: break-word; /* 内容自动换行，适配手机窄屏 */
        }
        /* 栏目列右对齐 */
        .label-col {
            text-align: right;
            white-space: nowrap;
        }
        /* 内容列左对齐 */
        .content-col {
            text-align: left;
        }
        /* 标题跨列居中 */
        .cert-title {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <table class="cert-table">
        <!-- 标题行（跨4列） -->
        <tr>
            <td colspan="4" class="cert-title">建筑业企业资质证书</td>
        </tr>
        <!-- 企业名称（跨4列） -->
        <tr>
            <td class="label-col">企业名称：</td>
            <td colspan="3" class="content-col">拾昊家居装饰工程(成都)有限责任公司</td>
        </tr>
        <!-- 详细地址（跨4列） -->
        <tr>
            <td class="label-col">详细地址：</td>
            <td colspan="3" class="content-col">中国（四川）自由贸易实验区成都高新区天和西二街189号1栋7层7025号</td>
        </tr>
        <!-- 统一社会信用代码 + 法人代表（四列） -->
        <tr>
            <td class="label-col">统一社会信用代码<br>(或营业执照注册号)：</td>
            <td class="content-col">9I5M0KCOMADPC2Y5B</td>
            <td class="label-col">法人代表：</td>
            <td class="content-col">石庆久</td>
        </tr>
        <!-- 注册资本金 + 经济性质（四列） -->
        <tr>
            <td class="label-col">注册资本金：</td>
            <td class="content-col">300.0万元人民币</td>
            <td class="label-col">经济性质：</td>
            <td class="content-col">有限责任公司（自然人独资）</td>
        </tr>
        <!-- 证书编号 + 有效期（四列） -->
        <tr>
            <td class="label-col">证书编号：</td>
            <td class="content-col">D251166883</td>
            <td class="label-col">有效期：</td>
            <td class="content-col">2030年10月31日</td>
        </tr>
        <!-- 发证机关 + 发证日期（四列） -->
        <tr>
            <td class="label-col">发证机关：</td>
            <td class="content-col">四川省住房和城乡建设厅</td>
            <td class="label-col">发证日期：</td>
            <td class="content-col">2025年10月31日</td>
        </tr>
        <!-- 正本打印流水号 + 副本打印流水号（四列） -->
        <tr>
            <td class="label-col">正本打印流水号：</td>
            <td class="content-col">16678</td>
            <td class="label-col">副本打印流水号：</td>
            <td class="content-col">16678</td>
        </tr>
        <!-- 资质范围（跨4列） -->
        <tr>
            <td class="label-col">资质范围：</td>
            <td colspan="3" class="content-col">建筑装修装饰工程专业承包贰级</td>
        </tr>
    </table>
</body>
</html>
