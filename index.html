<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资质证书查询</title>
    <style>
        /* 全局样式 */
        body {
            font-family: "SimSun", "Microsoft YaHei", serif; /* 宋体/微软雅黑，贴近官方证书风格 */
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
            background-color: #f5f5f5;
        }
        /* 顶部标题栏 */
        .page-header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        /* 证书表格样式 */
        .cert-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            border: 1px solid #999;
        }
        /* 表格单元格样式 */
        .cert-table td {
            border: 1px solid #999;
            padding: 12px 15px;
            font-size: 18px;
            line-height: 1.8;
            vertical-align: top;
        }
        /* 标题行样式 */
        .cert-table .title-row {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            background-color: #fff;
            border-bottom: 2px solid #999;
        }
        /* 全宽行样式（企业名称、地址、资质范围） */
        .cert-table .full-width {
            text-align: left;
        }
        /* 适配手机端 */
        @media (max-width: 480px) {
            .cert-table td {
                font-size: 16px;
                padding: 10px 12px;
            }
            .cert-table .title-row {
                font-size: 24px;
            }
            .page-header {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="page-header">资质证书查询</div>
    <table class="cert-table">
        <!-- 标题行 -->
        <tr>
            <td colspan="2" class="title-row">建筑业企业资质证书</td>
        </tr>
        <!-- 企业名称 -->
        <tr>
            <td colspan="2" class="full-width">
                <strong>企业名称：</strong>拾昊家居装饰工程(成都)有限责任公司
            </td>
        </tr>
        <!-- 详细地址 -->
        <tr>
            <td colspan="2" class="full-width">
                <strong>详细地址：</strong>中国（四川）自由贸易实验区成都高新区天和西二街189号1栋7层7025号
            </td>
        </tr>
        <!-- 统一社会信用代码 + 法人代表 -->
        <tr>
            <td>
                <strong>统一社会信用代码<br>(或营业执照注册号)：</strong>9I5M0KCOMADPC2Y5B
            </td>
            <td>
                <strong>法人代表：</strong>石庆久
            </td>
        </tr>
        <!-- 注册资本金 + 经济性质 -->
        <tr>
            <td>
                <strong>注册资本金：</strong>300.0万元人民币
            </td>
            <td>
                <strong>经济性质：</strong>有限责任公司（自然人独资）
            </td>
        </tr>
        <!-- 证书编号 + 有效期 -->
        <tr>
            <td>
                <strong>证书编号：</strong>D251166883
            </td>
            <td>
                <strong>有效期：</strong>2030年10月31日
            </td>
        </tr>
        <!-- 发证机关 + 发证日期 -->
        <tr>
            <td>
                <strong>发证机关：</strong>四川省住房和城乡建设厅
            </td>
            <td>
                <strong>发证日期：</strong>2025年10月31日
            </td>
        </tr>
        <!-- 正本流水号 + 副本流水号 -->
        <tr>
            <td>
                <strong>正本打印流水号：</strong>16678
            </td>
            <td>
                <strong>副本打印流水号：</strong>16678
            </td>
        </tr>
        <!-- 资质范围 -->
        <tr>
            <td colspan="2" class="full-width">
                <strong>资质范围：</strong>建筑装修装饰工程专业承包贰级
            </td>
        </tr>
    </table>
</body>
</html>
