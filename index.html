<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>资质证书查询</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.4;
            background-color: #FFFFFF;
        }
        .cert-table {
            width: 100%;
            border-collapse: collapse; /* 合并边框，和官方一致 */
        }
        .cert-table td {
            border: 1px solid #E0E0E0; /* 官方浅灰色边框 */
            padding: 4px 8px;
            vertical-align: top;
        }
        /* 栏目右对齐样式：固定宽度+右对齐，确保冒号位置统一 */
        .label {
            display: inline-block;
            width: 7em;
            text-align: right;
            margin-right: 4px;
        }
        /* 标题跨列居中 */
        .cert-title {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <table class="cert-table">
        <!-- 标题行（跨2列） -->
        <tr>
            <td colspan="2" class="cert-title">建筑业企业资质证书</td>
        </tr>
        <!-- 左右分栏：左列+右列 -->
        <tr>

                <div><span class="label">统一社会信用代码<br>(或营业执照注册号)：</span>9I5M0KCOMADPC2Y5B</div>
                <div><span class="label">注册资本金：</span>300.0万元人民币</div>
                <div><span class="label">证书编号：</span>D251166883</div>
                <div><span class="label">发证机关：</span>四川省住房和城乡建设厅</div>
                <div><span class="label">正本打印流水号：</span>16678</div>
                <div><span class="label">资质范围：</span>建筑装修装饰工程专业承包贰级</div>
            </td>
            <!-- 右列：包含法人代表、经济性质等条目 -->
            <td width="50%">
                <div><span class="label">法人代表：</span>石庆久</div>
                <div><span class="label">经济性质：</span>有限责任公司（自然人独资）</div>
                <div><span class="label">有效期：</span>2030年10月31日</div>
                <div><span class="label">发证日期：</span>2025年10月31日</div>
                <div><span class="label">副本打印流水号：</span>16678</div>
            </td>
        </tr>
    </table>
</body>
</html>
